    <script>
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        let audioCtx;

        function initAudio() {
            if (!audioCtx) audioCtx = new AudioContext();
        }

        function playMagicSound() {
            try {
                initAudio();
                if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
                const now = audioCtx.currentTime;
                const freqs = [523.25, 659.25, 783.99, 987.77, 1046.50, 1318.51];
                freqs.forEach((f, idx) => {
                    const osc = audioCtx.createOscillator();
                    const gain = audioCtx.createGain();
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(f, now + idx * 0.04);
                    gain.gain.setValueAtTime(0.1, now + idx * 0.04);
                    gain.gain.exponentialRampToValueAtTime(0.001, now + idx * 0.04 + 0.3);
                    osc.connect(gain);
                    gain.connect(audioCtx.destination);
                    osc.start(now + idx * 0.04);
                    osc.stop(now + idx * 0.04 + 0.3);
                });
            } catch (e) {}
        }

            // --- TEMA AURA & GEN Z / 67 ---

            "Sei precisa e imbattibile proprio come Max Verstappen quando domina un intero gran premio.",
            "Hai quel fascino e quel carisma unico che ha reso Lewis Hamilton una leggenda assoluta.",
            "Riesci a farmi battere il cuore piu forte di Charles Leclerc quando stacca in prima posizione a Monza.",
            "Sei una stella nascente con un futuro brillante e un talento puro esattamente come Kimi Antonelli.",
            "Se fossi una gara di Formula uno faresti registrare il giro veloce al primo tentativo.",
            "Con la tua energia superi chiunque in staccata all'esterno senza nemmeno fare fatica.",
            "Sei la pole position costante della mia vita, sempre al primo posto senza rivali.",
            "Ti aspetto di più della 33"
        ];

        const ButtonTexts = [
            "Un altro pensiero? ✨",
            "Te ne meriti un altro! 💖",
            "Un altro boost di dolcezza! 🌸",
            "Clicca per farti sorridere! 💕",
            "Un'altra frase speciale! 👑",
            "Continua a brillare! 🌟"
        ];

        let lastComplimentIndex = -1;
        let lastButtonIndex = -1;

        function generateNewCompliment() {
            playMagicSound();

            let complimentIndex;
            do {
                complimentIndex = Math.floor(Math.random() * GeneralCompliments.length);
            } while (complimentIndex === lastComplimentIndex);
            lastComplimentIndex = complimentIndex;

            let buttonIndex;
            do {
                buttonIndex = Math.floor(Math.random() * ButtonTexts.length);
            } while (buttonIndex === lastButtonIndex);
            lastButtonIndex = buttonIndex;

            const textEl = document.getElementById('compliment-text');
            const btnTextEl = document.getElementById('btn-text');
            
            textEl.style.opacity = '0';

            setTimeout(() => {
                textEl.innerText = `"${GeneralCompliments[complimentIndex]}"`;
                btnTextEl.innerText = ButtonTexts[buttonIndex];
                textEl.style.opacity = '1';
            }, 180);

            confetti({
                particleCount: 50,
                spread: 80,
                origin: { y: 0.7 },
                colors: ['#FF69B4', '#FF1493', '#FFD700', '#FFFFFF']
            });
        }

        function shareCompliment() {
            const text = document.getElementById('compliment-text').innerText;
            const tempInput = document.createElement("textarea");
            tempInput.value = text;
            document.body.appendChild(tempInput);
            tempInput.select();
            document.execCommand("copy");
            document.body.removeChild(tempInput);
            showToast("Frase copiata negli appunti! 💖");
        }

        function showToast(message) {
            const toast = document.getElementById('toast');
            const toastMsg = document.getElementById('toast-msg');
            toastMsg.innerText = message;
            toast.style.opacity = '1';
            setTimeout(() => { toast.style.opacity = '0'; }, 2400);
        }

        const canvas = document.getElementById('particles-canvas');
        const ctx = canvas.getContext('2d');
        let width = canvas.width = window.innerWidth;
        let height = canvas.height = window.innerHeight;

        window.addEventListener('resize', () => {
            width = canvas.width = window.innerWidth;
            height = canvas.height = window.innerHeight;
        });

        const particles = [];
        const symbols = ['💖', '✨', '🌸', '⭐', '💕'];

        class Particle {
            constructor() {
                this.x = Math.random() * width;
                this.y = Math.random() * height;
                this.size = Math.random() * 12 + 10;
                this.speedY = -(Math.random() * 0.7 + 0.2);
                this.symbol = symbols[Math.floor(Math.random() * symbols.length)];
                this.opacity = Math.random() * 0.35 + 0.15;
            }
            update() {
                this.y += this.speedY;
                if (this.y < -20) {
                    this.y = height + 20;
                    this.x = Math.random() * width;
                }
            }
            draw() {
                ctx.globalAlpha = this.opacity;
                ctx.font = `${this.size}px sans-serif`;
                ctx.fillText(this.symbol, this.x, this.y);
            }
        }

        for (let i = 0; i < 25; i++) particles.push(new Particle());

        function animateParticles() {
            ctx.clearRect(0, 0, width, height);
            particles.forEach(p => { p.update(); p.draw(); });
            requestAnimationFrame(animateParticles);
        }

        window.onload = function() {
            animateParticles();
            generateNewCompliment();
        };
    </script>
</body>
